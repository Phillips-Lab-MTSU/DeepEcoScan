<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DeepEcoScan</title>
    <link rel="stylesheet" href="style.css">
    <script src="vue.global.js"></script>
</head>
<body>
    <div id="app">
        <header class="top-nav">
            <div class="nav-wrapper">
                <a href="index.html" class="home-button">
                    <span>DeepEcoScan</span>
                </a>
            </div>
        </header>

        <section class="login-container">
            <div class="login-card">
                <h1>Welcome Back</h1>
                <p>DeepEcoScan uses <strong>JupyterHub</strong> for secure authentication.</p>
                
                <div class="info-box">
                    <span class="icon">&hearts;</span>
                    <p>Click below to sign in via the Phillips Lab gateway.</p>
                </div>

                <!-- FIXED BUTTON -->
                <button class="login-button primary" @click="login">
                    Sign in with MTSU
                </button>

                <div class="footer-links">
                    <a href="index.html">← Back to Home</a>
                    <a href="about.html">Need Help?</a>
                </div>
            </div>
        </section>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            methods: {
                login() {
                    // This triggers Traefik forward-auth OAuth flow
                    window.location.href = '/_oauth';
                },
                async checkAuth() {
                    try {
                        const response = await fetch('/api/auth/status', {
                            credentials: 'include'
                        });

                        if (response.ok) {
                            window.location.replace('/index.html');
                        }
                    } catch (error) {
                        console.error('Auth check failed on login page:', error);
                    }
                }
            },
            mounted() {
                this.checkAuth();
            }
        }).mount('#app');
    </script>
</body>
</html>
