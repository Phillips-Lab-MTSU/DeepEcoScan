apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-forwarded-user
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-User: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth
spec:
  forwardAuth:
    address: http://traefik-forward-auth.default.svc.cluster.local:4181
    authResponseHeaders:
      - X-Forwarded-User

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-forward-auth
  labels:
    app: traefik-forward-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-forward-auth
  template:
    metadata:
      labels:
        app: traefik-forward-auth
    spec:
      containers:
        - name: traefik-forward-auth
          image: jlphillips/traefik-forward-auth:phillips-lab
          ports:
            - containerPort: 4181
          env:
            - name: LOG_LEVEL
              value: debug
            - name: INSECURE_COOKIE
              value: "false"
            - name: DEFAULT_PROVIDER
              value: "generic-oauth"
            - name: PROVIDERS_GENERIC_OAUTH_SCOPE
              value: "identify"
            - name: PROVIDERS_GENERIC_OAUTH_AUTH_URL
              value: "https://jupyterhub.cs.mtsu.edu/phillips-lab/hub/api/oauth2/authorize"
            - name: PROVIDERS_GENERIC_OAUTH_TOKEN_URL
              value: "https://jupyterhub.cs.mtsu.edu/phillips-lab/hub/api/oauth2/token"
            - name: PROVIDERS_GENERIC_OAUTH_USER_URL
              value: "https://jupyterhub.cs.mtsu.edu/phillips-lab/hub/api/user"
            - name: PROVIDERS_GENERIC_OAUTH_CLIENT_ID
              value: "service-deepecoscan-oauth2"
            - name: URL_PATH
              value: "/_oauth"
            - name: SECRET
              valueFrom:  
                secretKeyRef:
                  name: traefik-forward-auth-secrets
                  key: SECRET
            - name: PROVIDERS_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: traefik-forward-auth-secrets
                  key: PROVIDERS_GENERIC_OAUTH_CLIENT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-forward-auth
  labels:
    app: traefik-forward-auth
spec:
  type: ClusterIP
  selector:
    app: traefik-forward-auth
  ports:
    - name: auth-http
      port: 4181
      targetPort: 4181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepecoscan-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepecoscan-backend
  template:
    metadata:
      labels:
        app: deepecoscan-backend
    spec:
      containers:
        - name: deepecoscan-backend
          image: hbastian/deepecoscan-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: deepecoscan-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: deepecoscan-backend-service
spec:
  selector:
    app: deepecoscan-backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepecoscan-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepecoscan-frontend
  template:
    metadata:
      labels:
        app: deepecoscan-frontend
    spec:
      containers:
        - name: deepecoscan-frontend
          image: hbastian/deepecoscan-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: deepecoscan-frontend-service
spec:
  selector:
    app: deepecoscan-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: deepecoscan
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`deepeco.local`) && PathPrefix(`/_oauth`)
      kind: Rule
      services:
        - name: traefik-forward-auth
          port: 4181

    - match: Host(`deepeco.local`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        # - name: strip-forwarded-user
        - name: traefik-forward-auth
      services:
        - name: deepecoscan-backend-service
          port: 3000

    - match: Host(`deepeco.local`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        # - name: strip-forwarded-user
        - name: traefik-forward-auth
      services:
        - name: deepecoscan-frontend-service
          port: 80
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: deepecoscan-secrets
  namespace: default
spec:
  encryptedData:
    DO_SPACES_BUCKET: 
    DO_SPACES_ENDPOINT: 
    DO_SPACES_KEY: 
    DO_SPACES_REGION: 
    DO_SPACES_SECRET: 
    MONGO_URI: 
  template:
    metadata:
      name: deepecoscan-secrets
      namespace: default
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: traefik-forward-auth-secrets
  namespace: default
spec:
  encryptedData:
    PROVIDERS_GENERIC_OAUTH_CLIENT_SECRET: 
    SECRET: 
  template:
    metadata:
      name: traefik-forward-auth-secrets
      namespace: default



