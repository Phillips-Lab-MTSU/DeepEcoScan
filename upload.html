<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Loader | DeepEcoScan</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    <div id="app">
        <header class="top-nav">
            <div class="nav-wrapper">
                <div class="nav-logo">
                    <a href="index.html" class="home-button">
                        <span class="icon">🏠</span> 
                        <span class="logo-text">DeepEcoScan</span>
                    </a>
                </div>

                <div class="nav-right-group">
                    <div class="menu-container">
                        <button class="menu-button">Menu ▾</button>
                        <div class="menu-content">
                            <a href="index.html">Home</a>
                            <a href="upload.html">File Loader</a>
                            <a href="#">About EcoScan</a>
                        </div>
                    </div>

                    <div class="account-container">
                        <div v-if="isLoggedIn" class="dropdown">
                            <button class="login-button">My Account ▾</button>
                            <div class="dropdown-content">
                                <p class="user-email">researcher@eco-scan.org</p>
                                <a href="#" @click="logout" class="logout-link">Logout</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="container dashboard">
            <div class="header-content">
                <h1>Sequence Workspace</h1>
                <p class="subtitle">Upload FASTA or FASTQ sequence files for analysis</p>
            </div>

            <div class="upload-area" 
                :class="{ 'dragover': isDragOver }"
                @click="triggerFileInput"
                @dragover.prevent="isDragOver = true"
                @dragleave="isDragOver = false"
                @drop.prevent="handleDrop">
                <div class="upload-icon">📁</div>
                <p>Drag and drop your file here or click to browse</p>
                <input type="file" ref="fileInput" @change="handleFileSelect" accept=".fasta,.fa,.fna,.fastq,.fq" style="display: none;">
            </div>

            <div class="file-info" v-if="selectedFile">
                <strong>Selected:</strong> {{ selectedFile.name }}
            </div>

            <button class="btn-scan" @click="uploadFile" :disabled="!selectedFile || isLoading">
                {{ isLoading ? 'Analyzing...' : 'Begin Scan' }}
            </button>

            <div class="file-list" v-if="uploadedFiles.length > 0">
                <h3>Your Recent Scans</h3>
                <div class="file-item" v-for="file in uploadedFiles" :key="file">
                    {{ file }}
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
